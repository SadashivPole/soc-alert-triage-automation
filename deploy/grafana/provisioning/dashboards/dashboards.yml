# Phase 3.7 (D11) — Grafana dashboard provisioning for the optional
# `observability` compose profile (lab use only).
#
# Loads every dashboard JSON from /var/lib/grafana/dashboards (mounted
# read-only from deploy/grafana/dashboards). The dashboard provider is
# declarative and non-secret; no API keys or credentials are involved.

apiVersion: 1

providers:
  - name: soc-triage-observability
    orgId: 1
    folder: Phase 3.7 SOC Observability
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
