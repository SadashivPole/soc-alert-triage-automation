# Detection coverage catalog (roadmap item 6.1 — detection coverage framework).
#
# This file is the machine-readable source of truth for the coverage table in
# docs/detection-coverage.md, which documents the schema and the known gaps.
#
# RULES FOR THIS FILE
#   * Every value must be verifiable from the repository. Nothing is inferred.
#   * Rule-backed entries describe ONLY rules that exist in
#     wazuh/ruleset/rules/soc-triage-rules.xml.
#   * Scenario entries describe ONLY the Phase 5 evaluation fixtures that exist in
#     app/tests/fixtures/ and evaluation/{corpus,ground_truth}.json.
#   * Do not add a detection, ATT&CK id, scenario, runbook, or test reference that does
#     not exist in this repository. Use the "gaps" section of the doc instead.
#
# Validated by app/tests/evaluation/test_detection_coverage.py.

version: "1.0"

