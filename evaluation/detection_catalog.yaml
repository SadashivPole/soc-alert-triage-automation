# --------------------------------------------------------------------------------
# Evaluation scenarios (Phase 5 corpus). Each scenario is one synthetic fixture whose
# runtime outcome is pinned by evaluation/ground_truth.json and replayed through the
# real ingest path by app/tests/evaluation/test_evaluation.py.
#
# rule_id / rule_level / mitre_attack are the values DECLARED INSIDE the synthetic
# fixture (built-in Wazuh rule ids are illustrative — see docs/sample-alerts/README.md).
# rule_provenance records that these are fixture-declared, not live-manager-observed.
#
# validation_status values:
#   locally-validated — replayed in the local test harness and pinned by ground truth.
# --------------------------------------------------------------------------------
scenarios:
