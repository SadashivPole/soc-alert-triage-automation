# --------------------------------------------------------------------------------
# Known, unresolved conflicts between declaring sources. Both values and both
# sources are recorded; nothing is resolved here. An entry is *live* only while
# its sources still declare the recorded values — the validation test fails
# when either side changes without this record being updated (and fails when
# the record is removed while the conflict persists).
# --------------------------------------------------------------------------------
known_discrepancies:
  - id: G5
    status: recorded-unresolved
    summary: >-
      The same FIM behavior (modification of a monitored file, e.g.
      /etc/passwd) is declared as two different ATT&CK technique ids by two
      repository sources: the evaluation fixture SCN-03 (fixture-declared rule
      550) declares T1566 — paired with the technique name
      "Modify Authentication Process" — while the custom rule DET-100110
      (rule 100110, a child of rule 550 via if_sid) declares T1565.
    values:
      - value: "T1566"
        declared_by:
          file: app/tests/fixtures/03_wazuh_fim_etc_passwd_change.json
          path: rule.mitre.id
        detail: >-
          Scenario SCN-03, fixture-declared rule 550; the same block declares
          the technique name "Modify Authentication Process" and the tactics
          Persistence, Privilege Escalation.
      - value: "T1565"
        declared_by:
          file: wazuh/ruleset/rules/soc-triage-rules.xml
          path: "rule[@id='100110']/mitre/id"
        detail: >-
          Custom detection DET-100110 (evaluation/detection_catalog.yaml),
          parent-rule linked to SCN-03 by the detection catalog.
    scoring_impact: >-
      None. scoring.v1 counts ATT&CK presence only (the rule_groups_mitre
      factor); technique identity never influences a score, tier, or action.
    resolution: >-
      None — recorded as declared. Resolving the conflict requires a
      deliberate change to one of the two source files, accompanied by updates
      to this record, the detection catalog, and both coverage documents.
