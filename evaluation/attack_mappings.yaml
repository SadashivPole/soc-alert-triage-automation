# MITRE ATT&CK mapping registry (roadmap item 6.2 — ATT&CK mapping framework).
#
# This file is the machine-readable source of truth for which MITRE ATT&CK
# techniques the repository's detections and evaluation scenarios declare.
# Its human-readable rendering is docs/attack-coverage.md; its companion
# inventory (rules, scenarios, expected outcomes, runbooks, regression tests)
# is the Phase 6.1 detection catalog, evaluation/detection_catalog.yaml.
#
# RULES FOR THIS FILE (same discipline as the detection catalog)
#   * Every value must be verifiable from the repository. Nothing is inferred.
#   * Technique ids, names, and tactics are recorded EXACTLY as their source
#     file declares them — never corrected, completed, or validated against an
#     external ATT&CK release (see `attack_reference` below).
#   * Every mapping carries provenance: the file that declares it (and the
#     path within that file, where a path is meaningful).
#   * A rule or scenario that declares no technique is recorded with an empty
#     `technique_ids` list — absence is recorded, never guessed.
#   * Known conflicts between sources are recorded under `known_discrepancies`
#     with both values and both sources; they are never silently resolved.
#   * Do not add a technique id, name, tactic, rule, scenario, or discrepancy
#     that a repository file does not already declare.
#
# Validated by app/tests/evaluation/test_attack_mappings.py.

version: "1.0"

# The repository contains no MITRE ATT&CK reference data: no STIX/bundle, no
# id → name/tactic registry, no pinned matrix version, and no external or
# runtime lookup. Every name and tactic below is *declared by a repository
# file* (evaluation fixtures declare `rule.mitre.technique` / `rule.mitre.tactic`;
# the custom ruleset declares ids only). `matrix_verification: unverified` is a
# property of this registry, not a TODO: it may only change if reference data
# is introduced deliberately, with a plan to validate every recorded value.
# Runtime behavior is deliberately NOT driven by this file — the triage
# pipeline consumes source-declared `rule.mitre` verbatim (Phase 6.1/6.2
# design: the registry reports and traces; it never scores, routes, or enrich).
attack_reference:
  source: none
  matrix_verification: unverified

# --------------------------------------------------------------------------------
# Techniques — one entry per distinct ATT&CK id declared by a repository source
# (the custom ruleset or an evaluation fixture). `declared_names` /
# `declared_tactics` are the verbatim `rule.mitre.technique` / `rule.mitre.tactic`
# values of the fixtures that declare the id (sorted, deduplicated). Both are
# empty when no fixture declares the id: T1565 is declared by the custom
# ruleset only, and no machine-readable source declares a name or tactic for it
# (docs/detection-coverage.md hand-annotates a tactic in prose — unvalidated
# documentation, not recorded here as data).
# --------------------------------------------------------------------------------
