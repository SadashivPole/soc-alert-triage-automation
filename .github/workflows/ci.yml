name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    name: Lint, type-check & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: app/pyproject.toml
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest

  compose-config:
    name: Docker Compose config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CI-only Compose secrets
        run: |
          echo "N8N_ENCRYPTION_KEY=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "WAZUH_API_USERNAME=ci-wazuh-user" >> "$GITHUB_ENV"
          echo "WAZUH_API_PASSWORD=ci-wazuh-password" >> "$GITHUB_ENV"
          echo "TRIAGE_INGEST_API_KEY=ci-triage-key" >> "$GITHUB_ENV"

      - name: Validate Docker Compose configuration
        run: docker compose config -q
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check_secrets.sh

  console-js-tests:
    name: Console JS unit tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node --test app/tests/js/console_core.test.cjs
