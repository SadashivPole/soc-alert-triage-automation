# Phase 2C — SOAR Lab Configuration
# Services: triage-api + n8n + mailpit
# No TheHive, no autonomous containment, no new providers.
# Based on ARCHITECTURE.md §13, SECURITY.md §4.

services:
  triage-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soc-triage-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # 12-factor: all config from env (see .env)
      SOC_ENV: ${SOC_ENV:-development}
      SOC_LOG_LEVEL: ${SOC_LOG_LEVEL:-INFO}
      SOC_INSTANCE_NAME: ${SOC_INSTANCE_NAME:-soc-lab}
      TRIAGE_API_HOST: 0.0.0.0
      TRIAGE_API_PORT: 8000
      TRIAGE_DB_URL: ${TRIAGE_DB_URL:-sqlite:////data/soc_triage.db}
      TRIAGE_DEDUPE_WINDOW_SECONDS: ${TRIAGE_DEDUPE_WINDOW_SECONDS:-900}
      TRIAGE_INGEST_API_KEY: ${TRIAGE_INGEST_API_KEY:-lab-test-key-change-in-production}
      N8N_CALLBACK_TOKEN: ${N8N_CALLBACK_TOKEN:-lab-n8n-token-change-in-production}
      N8N_WEBHOOK_TOKEN: ${N8N_WEBHOOK_TOKEN:-lab-n8n-token-change-in-production}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/soc-alert-scored}
      TRIAGE_API_BASE_URL: ${TRIAGE_API_BASE_URL:-http://triage-api:8000}
    volumes:
      - ./data:/data
    networks:
      - soc-core
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    # NOTE: n8n and Mailpit are optional integration targets. The API starts
    # independently and notifications fail open when those services are down.
    # No `depends_on` is declared so an n8n/Mailpit outage cannot block startup.

  n8n:
    image: n8nio/n8n:1.85.0
    container_name: soc-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Shared secret for webhook/auth (never in JSON, never logged)
      N8N_WEBHOOK_TOKEN: ${N8N_WEBHOOK_TOKEN:-lab-n8n-token-change-in-production}
      N8N_CALLBACK_TOKEN: ${N8N_CALLBACK_TOKEN:-lab-n8n-token-change-in-production}
      N8N_WEBHOOK_BASE_URL: ${N8N_WEBHOOK_BASE_URL:-http://n8n:5678}
      # The checked-in workflows resolve the API base from TRIAGE_API_BASE_URL.
      TRIAGE_API_BASE_URL: ${TRIAGE_API_BASE_URL:-http://triage-api:8000}
      # Compatibility alias retained for deployments that reference TRIAGE_API_URL.
      TRIAGE_API_URL: ${TRIAGE_API_BASE_URL:-http://triage-api:8000}
      # Required and stable. Do not hardcode a key here. Generate once into
      # `.env` and keep it. Changing N8N_ENCRYPTION_KEY while reusing the
      # existing n8n-data volume causes "Mismatching encryption keys".
      # Fresh volumes initialize cleanly; this stack never deletes n8n-data.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env and keep it stable}
      # Optional SMTP to Mailpit for notifications. Values match the $env.*
      # references used by the checked-in workflows.
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: false
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: ${SMTP_FROM:-soc@lab.local}
      SOC_FROM_EMAIL: ${SOC_FROM_EMAIL:-soc@lab.local}
      SOC_ANALYST_EMAILS: ${SOC_ANALYST_EMAILS:-analyst@lab.local}
      SOC_L1_EMAIL: ${SOC_L1_EMAIL:-analyst@lab.local}
      SOC_L2_EMAILS: ${SOC_L2_EMAILS:-l2@lab.local}
      SOC_L2_EMAIL: ${SOC_L2_EMAIL:-l2@lab.local}
      SLACK_CHANNEL_L1: ${SLACK_CHANNEL_L1:-#soc-l1}
    volumes:
      # Persistent n8n home (workflows, credentials, DB if using SQLite)
      - n8n-data:/home/node/.n8n
      # Mount existing workflow JSONs (source of truth per n8n/README.md)
      - ./n8n/workflows:/workflows:ro
      # Lab SMTP credential default (Mailpit, no auth). The import helper
      # renders the actual credential from SMTP_* env at startup (Phase 2D).
      - ./n8n/credentials:/credentials:ro
      # Lab-only import helper executed before n8n starts.
      - ./scripts/n8n-import-workflows.sh:/usr/local/bin/n8n-import-workflows.sh:ro
    networks:
      - soc-core
      - soc-edge
    # n8nio/n8n:1.85.0 ENTRYPOINT is the n8n CLI (via tini). Passing `sh` as
    # `command` makes n8n treat `sh` as an n8n subcommand ("command sh not
    # found"). Override the entrypoint with a real shell wrapper instead.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "/usr/local/bin/n8n-import-workflows.sh && exec n8n start"
    # Healthcheck using n8n's internal endpoint if available; fallback to port open
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || curl -sf http://127.0.0.1:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s

  mailpit:
    image: axllent/mailpit:v1.20
    container_name: soc-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_WEBROOT: /
      MP_DB: /data/mailpit.db
      # Do not expose real secrets; lab only
      MP_SMTP_AUTO_TLS: "false"
    volumes:
      - ./data/mailpit:/data
    networks:
      - soc-core
    healthcheck:
      # Documented Mailpit readiness endpoint (GET /api/v1/status is 404).
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8025/readyz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Phase 3.7 (D11) — optional observability profile (approved decision D2).
  #
  # `docker compose --profile observability up` adds ONLY prometheus + grafana.
  # They are strictly additive and OPTIONAL: no default service depends on
  # them, port 9090 is never published (internal soc-core scrape only), and
  # Grafana publishes 3000 for lab access (ARCHITECTURE.md §13).
  # ---------------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: soc-prometheus
    restart: unless-stopped
    profiles: ["observability"]
    # Secret-free scrape config from deploy/prometheus/prometheus.yml; the
    # entrypoint optionally injects METRICS_SCRAPE_TOKEN credentials at
    # runtime (env-supplied, never committed; see deploy/prometheus/entrypoint.sh).
    entrypoint: ["/usr/local/bin/prometheus-entrypoint.sh"]
    command:
      # --config.file here is replaced by the entrypoint when it generates an
      # auth-enabled config (the entrypoint drops the duplicate flag).
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    environment:
      # Existing METRICS_SCRAPE_TOKEN model (D1): empty = auth disabled on the
      # API side; set = bearer credentials injected at container start only.
      METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-}
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/entrypoint.sh:/usr/local/bin/prometheus-entrypoint.sh:ro
      - prometheus-data:/prometheus
    networks:
      # Internal only: reaches triage-api:8000 and is reachable by Grafana.
      # NOT on soc-edge: 9090/9091 are never host-visible.
      - soc-core
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  grafana:
    image: grafana/grafana:12.1.0
    container_name: soc-grafana
    restart: unless-stopped
    profiles: ["observability"]
    # Lab access only (ARCHITECTURE.md §13 table): 3000 published, nothing else.
    ports:
      - "3000:3000"
    environment:
      # Declarative provisioning from deploy/grafana/ (datasource + dashboards).
      # The lab uses the image default login and should change it beyond
      # localhost — no credentials are committed here.
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      # soc-core only: Grafana reaches Prometheus (http://prometheus:9090)
      # internally; the host reaches it through the published 3000 port.
      - soc-core
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

networks:
  soc-core:
    driver: bridge
  soc-edge:
    driver: bridge

volumes:
  n8n-data:
    driver: local
  # Phase 3.7 (D11) — observability profile state only (additive; never
  # required by the default stack).
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
