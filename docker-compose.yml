# Phase 2C — SOAR Lab Configuration
# Services: triage-api + n8n + mailpit
# No TheHive, no autonomous containment, no new providers.
# Based on ARCHITECTURE.md §13, SECURITY.md §4.

services:
  triage-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soc-triage-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # 12-factor: all config from env (see .env)
      SOC_ENV: ${SOC_ENV:-development}
      SOC_LOG_LEVEL: ${SOC_LOG_LEVEL:-INFO}
      SOC_INSTANCE_NAME: ${SOC_INSTANCE_NAME:-soc-lab}
      TRIAGE_API_HOST: 0.0.0.0
      TRIAGE_API_PORT: 8000
      TRIAGE_DB_URL: ${TRIAGE_DB_URL:-sqlite:////data/soc_triage.db}
      TRIAGE_DEDUPE_WINDOW_SECONDS: ${TRIAGE_DEDUPE_WINDOW_SECONDS:-900}
      TRIAGE_CORRELATION_WINDOW_SECONDS: ${TRIAGE_CORRELATION_WINDOW_SECONDS:-900}
      TRIAGE_INGEST_API_KEY: ${TRIAGE_INGEST_API_KEY:-lab-test-key-change-in-production}
      N8N_CALLBACK_TOKEN: ${N8N_CALLBACK_TOKEN:-lab-n8n-token-change-in-production}
      N8N_WEBHOOK_TOKEN: ${N8N_WEBHOOK_TOKEN:-lab-n8n-token-change-in-production}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/soc-alert-scored}
      TRIAGE_API_BASE_URL: ${TRIAGE_API_BASE_URL:-http://triage-api:8000}
      # Phase 2.4 — MISP threat-intel lookups (optional `intel` profile).
      # Both MISP_URL and MISP_API_KEY must be non-empty to enable the provider
      # (disable-by-empty, ARCHITECTURE.md §14); the defaults stay empty, so the
      # zero-external fallback is untouched unless an operator opts in. The key
      # is never inlined here — it comes from .env / the secret store only.
      MISP_URL: ${MISP_URL:-}
      MISP_API_KEY: ${MISP_API_KEY:-}
      MISP_VERIFY_TLS: ${MISP_VERIFY_TLS:-1}
      # Phase 2.7A — automatic late-enrichment trigger (disabled by default).
      # Background re-assessment of persisted alerts whose enrichment changed
      # (late verdicts, retried failed lookups). No new services or queues;
      # idempotent, bounded, and never touches the ingest path.
      LATE_ENRICHMENT_SWEEP_ENABLED: ${LATE_ENRICHMENT_SWEEP_ENABLED:-0}
      LATE_ENRICHMENT_SWEEP_INTERVAL_SECONDS: ${LATE_ENRICHMENT_SWEEP_INTERVAL_SECONDS:-300}
      LATE_ENRICHMENT_LOOKBACK_SECONDS: ${LATE_ENRICHMENT_LOOKBACK_SECONDS:-604800}
    volumes:
      - ./data:/data
    networks:
      - soc-core
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    # NOTE: n8n and Mailpit are optional integration targets. The API starts
    # independently and notifications fail open when those services are down.
    # No `depends_on` is declared so an n8n/Mailpit outage cannot block startup.

  n8n:
    image: n8nio/n8n:1.85.0
    container_name: soc-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Shared secret for webhook/auth (never in JSON, never logged)
      N8N_WEBHOOK_TOKEN: ${N8N_WEBHOOK_TOKEN:-lab-n8n-token-change-in-production}
      N8N_CALLBACK_TOKEN: ${N8N_CALLBACK_TOKEN:-lab-n8n-token-change-in-production}
      N8N_WEBHOOK_BASE_URL: ${N8N_WEBHOOK_BASE_URL:-http://n8n:5678}
      # The checked-in workflows resolve the API base from TRIAGE_API_BASE_URL.
      TRIAGE_API_BASE_URL: ${TRIAGE_API_BASE_URL:-http://triage-api:8000}
      # Compatibility alias retained for deployments that reference TRIAGE_API_URL.
      TRIAGE_API_URL: ${TRIAGE_API_BASE_URL:-http://triage-api:8000}
      # Required and stable. Do not hardcode a key here. Generate once into
      # `.env` and keep it. Changing N8N_ENCRYPTION_KEY while reusing the
      # existing n8n-data volume causes "Mismatching encryption keys".
      # Fresh volumes initialize cleanly; this stack never deletes n8n-data.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env and keep it stable}
      # Optional SMTP to Mailpit for notifications. Values match the $env.*
      # references used by the checked-in workflows.
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: false
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: ${SMTP_FROM:-soc@lab.local}
      SOC_FROM_EMAIL: ${SOC_FROM_EMAIL:-soc@lab.local}
      SOC_ANALYST_EMAILS: ${SOC_ANALYST_EMAILS:-analyst@lab.local}
      SOC_L1_EMAIL: ${SOC_L1_EMAIL:-analyst@lab.local}
      SOC_L2_EMAILS: ${SOC_L2_EMAILS:-l2@lab.local}
      SOC_L2_EMAIL: ${SOC_L2_EMAIL:-l2@lab.local}
      SLACK_CHANNEL_L1: ${SLACK_CHANNEL_L1:-#soc-l1}
    volumes:
      # Persistent n8n home (workflows, credentials, DB if using SQLite)
      - n8n-data:/home/node/.n8n
      # Mount existing workflow JSONs (source of truth per n8n/README.md)
      - ./n8n/workflows:/workflows:ro
      # Lab SMTP credential default (Mailpit, no auth). The import helper
      # renders the actual credential from SMTP_* env at startup (Phase 2D).
      - ./n8n/credentials:/credentials:ro
      # Lab-only import helper executed before n8n starts.
      - ./scripts/n8n-import-workflows.sh:/usr/local/bin/n8n-import-workflows.sh:ro
    networks:
      - soc-core
      - soc-edge
    # n8nio/n8n:1.85.0 ENTRYPOINT is the n8n CLI (via tini). Passing `sh` as
    # `command` makes n8n treat `sh` as an n8n subcommand ("command sh not
    # found"). Override the entrypoint with a real shell wrapper instead.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "/usr/local/bin/n8n-import-workflows.sh && exec n8n start"
    # Healthcheck using n8n's internal endpoint if available; fallback to port open
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || curl -sf http://127.0.0.1:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s

  mailpit:
    image: axllent/mailpit:v1.20
    container_name: soc-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_WEBROOT: /
      MP_DB: /data/mailpit.db
      # Do not expose real secrets; lab only
      MP_SMTP_AUTO_TLS: "false"
    volumes:
      - ./data/mailpit:/data
    networks:
      - soc-core
    healthcheck:
      # Documented Mailpit readiness endpoint (GET /api/v1/status is 404).
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8025/readyz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Phase 3.7 (D11) — optional observability profile (approved decision D2).
  #
  # `docker compose --profile observability up` adds ONLY prometheus + grafana.
  # They are strictly additive and OPTIONAL: no default service depends on
  # them, port 9090 is never published (internal soc-core scrape only), and
  # Grafana publishes 3000 for lab access (ARCHITECTURE.md §13).
  # ---------------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: soc-prometheus
    restart: unless-stopped
    profiles: ["observability"]
    # Secret-free scrape config from deploy/prometheus/prometheus.yml; the
    # entrypoint optionally injects METRICS_SCRAPE_TOKEN credentials at
    # runtime (env-supplied, never committed; see deploy/prometheus/entrypoint.sh).
    entrypoint: ["/usr/local/bin/prometheus-entrypoint.sh"]
    command:
      # --config.file here is replaced by the entrypoint when it generates an
      # auth-enabled config (the entrypoint drops the duplicate flag).
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    environment:
      # Existing METRICS_SCRAPE_TOKEN model (D1): empty = auth disabled on the
      # API side; set = bearer credentials injected at container start only.
      METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-}
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/entrypoint.sh:/usr/local/bin/prometheus-entrypoint.sh:ro
      - prometheus-data:/prometheus
    networks:
      # Internal only: reaches triage-api:8000 and is reachable by Grafana.
      # NOT on soc-edge: 9090/9091 are never host-visible.
      - soc-core
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  grafana:
    image: grafana/grafana:12.1.0
    container_name: soc-grafana
    restart: unless-stopped
    profiles: ["observability"]
    # Lab access only (ARCHITECTURE.md §13 table): 3000 published, nothing else.
    ports:
      - "3000:3000"
    environment:
      # Declarative provisioning from deploy/grafana/ (datasource + dashboards).
      # The lab uses the image default login and should change it beyond
      # localhost — no credentials are committed here.
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      # soc-core only: Grafana reaches Prometheus (http://prometheus:9090)
      # internally; the host reaches it through the published 3000 port.
      - soc-core
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ---------------------------------------------------------------------------
  # Phase 4.1 — optional `full` profile: the real Wazuh manager.
  #
  # `docker compose --profile full up` adds ONLY wazuh-manager. It is strictly
  # additive: no default service depends on it, and with the profile disabled
  # the stack keeps running in `sim` mode against docs/sample-alerts/
  # (zero-external fallback preserved, ARCHITECTURE.md §13).
  #
  # Defensive-only: the manager is a detection/forwarding source. No
  # containment/response configuration is mounted here (SECURITY.md 1).
  # ---------------------------------------------------------------------------
  wazuh-manager:
    image: wazuh/wazuh-manager:4.9.2
    container_name: soc-wazuh-manager
    restart: unless-stopped
    profiles: ["full"]
    ports:
      # Agent enrollment/reporting only (ARCHITECTURE.md §13 table).
      # The Wazuh API (55000) is NOT published: it stays internal to soc-core.
      - "1514:1514/tcp"
      - "1515:1515/tcp"
    environment:
      # Wazuh's own bootstrap credentials — no defaults, no committed values.
      INDEXER_URL: ${WAZUH_INDEXER_URL:-}
      API_USERNAME: ${WAZUH_API_USERNAME:?Set WAZUH_API_USERNAME in .env}
      API_PASSWORD: ${WAZUH_API_PASSWORD:?Set WAZUH_API_PASSWORD in .env}
      # Consumed by wazuh/integrator/custom-triage: the ingest contract is the
      # existing X-API-Key header, and the key only ever exists in the
      # environment (never in ossec.conf, never in the image).
      TRIAGE_API_BASE_URL: ${TRIAGE_API_BASE_URL:-http://triage-api:8000}
      TRIAGE_INGEST_API_KEY: ${TRIAGE_INGEST_API_KEY:?Set TRIAGE_INGEST_API_KEY in .env}
      WAZUH_INTEGRATOR_MIN_LEVEL: ${WAZUH_INTEGRATOR_MIN_LEVEL:-5}
      WAZUH_INTEGRATOR_EXCLUDED_RULE_IDS: ${WAZUH_INTEGRATOR_EXCLUDED_RULE_IDS:-}
      WAZUH_INTEGRATOR_EXCLUDED_GROUPS: ${WAZUH_INTEGRATOR_EXCLUDED_GROUPS:-}
      WAZUH_INTEGRATOR_TIMEOUT_SECONDS: ${WAZUH_INTEGRATOR_TIMEOUT_SECONDS:-5}
      WAZUH_INTEGRATOR_MAX_ATTEMPTS: ${WAZUH_INTEGRATOR_MAX_ATTEMPTS:-3}
      WAZUH_INTEGRATOR_SPOOL_DIR: ${WAZUH_INTEGRATOR_SPOOL_DIR:-/var/ossec/logs/triage-spool}
      WAZUH_INTEGRATOR_SPOOL_MAX_ENTRIES: ${WAZUH_INTEGRATOR_SPOOL_MAX_ENTRIES:-1000}
      WAZUH_INTEGRATOR_VERIFY_TLS: ${WAZUH_INTEGRATOR_VERIFY_TLS:-1}
    volumes:
      # Complete ossec.conf. The image copies /wazuh-config-mount/<path> over
      # /var/ossec/<path> at start (cont-init.d/0-wazuh-init). Wazuh has NO
      # ossec.conf.d include mechanism, so this must be the whole file.
      - ./wazuh/config/ossec.conf:/wazuh-config-mount/etc/ossec.conf:ro
      # Integrator sources (read-only; this repo stays the source of truth).
      # The entrypoint script installs them into /var/ossec/integrations with
      # the root:wazuh 750 ownership Wazuh requires.
      - ./wazuh/integrator:/triage-integration:ro
      - ./wazuh/entrypoint-scripts:/entrypoint-scripts:ro
      - wazuh-manager-etc:/var/ossec/etc

      # Phase 4.3 — repository-owned custom detection content.
      # These files are mounted into Wazuh's supported user-defined
      # rules/decoder directories.
      - ./wazuh/ruleset/rules:/var/ossec/etc/rules:ro
      - ./wazuh/ruleset/decoders:/var/ossec/etc/decoders:ro

      - wazuh-manager-logs:/var/ossec/logs
      - wazuh-manager-queue:/var/ossec/queue
    networks:
      # soc-core only: reaches triage-api:8000 internally. Not on soc-edge —
      # the Wazuh API is never host-visible.
      - soc-core
    healthcheck:
      test: ["CMD-SHELL", "/var/ossec/bin/wazuh-control status | grep -q 'wazuh-analysisd is running'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    security_opt:
      - no-new-privileges:true
    ulimits:
      memlock: -1
      nofile:
        soft: 655360
        hard: 655360
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  # ---------------------------------------------------------------------------
  # Phase 2.4 — optional `intel` profile: self-hosted MISP (threat intel).
  #
  # `docker compose --profile intel up -d` adds ONLY the MISP stack. It is
  # strictly additive and OPTIONAL: no default service depends_on it, nothing is
  # published to the host (internal `soc-core` only), and with the profile
  # disabled the stack keeps running with `enrichment_status: skipped` — the
  # zero-external fallback is preserved (ARCHITECTURE.md §7.3, §13, §14).
  #
  # Lookup-only by design: the platform reads `/attributes/restSearch` and never
  # writes, publishes or pushes to MISP (SECURITY.md §1). Seeding is an explicit,
  # documented operator action (misp/README.md, misp/seeding.md) using only
  # synthetic documentation-range indicators (SECURITY.md §5).
  #
  # Every image is pinned to an exact version (no `latest`); every credential is
  # supplied by the environment — no values are committed (SECURITY.md §2, §4).
  #
  # Why a guard container instead of `${VAR:?}` on the services below: Compose
  # interpolates the WHOLE file (profile-gated services included) before it
  # filters inactive profiles, so a required-variable syntax here would make the
  # default `docker compose up -d` fail until MISP was configured — the opposite
  # of "strictly additive". `misp-preflight` runs only with the profile and
  # aborts it, with an explicit message, before any MISP container can start with
  # an upstream default credential (upstream falls back to MYSQL_PASSWORD=example,
  # REDIS_PASSWORD=redispassword, GPG_PASSPHRASE=passphrase and a generated admin
  # password/API key). MISP_* defaults therefore stay empty and unsafe states are
  # impossible rather than merely discouraged.
  # ---------------------------------------------------------------------------

  # One-shot, network-less secret guard for the `intel` profile (see above).
  misp-preflight:
    image: busybox:1.37.0
    container_name: soc-misp-preflight
    profiles: ["intel"]
    restart: "no"
    # No network, no capabilities, no writable filesystem: it only inspects env.
    network_mode: none
    read_only: true
    environment:
      # Interpolation-safe (`:-` with an empty default) so every other profile
      # keeps parsing; the check below is what enforces "must be set" at runtime.
      MISP_DB_PASSWORD: ${MISP_DB_PASSWORD:-}
      MISP_DB_ROOT_PASSWORD: ${MISP_DB_ROOT_PASSWORD:-}
      MISP_REDIS_PASSWORD: ${MISP_REDIS_PASSWORD:-}
      MISP_ADMIN_EMAIL: ${MISP_ADMIN_EMAIL:-}
      MISP_ADMIN_PASSWORD: ${MISP_ADMIN_PASSWORD:-}
      MISP_ADMIN_KEY: ${MISP_ADMIN_KEY:-}
      MISP_GPG_PASSPHRASE: ${MISP_GPG_PASSPHRASE:-}
      MISP_ENCRYPTION_KEY: ${MISP_ENCRYPTION_KEY:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        missing=""
        require() { [ -n "$2" ] || missing="$missing $1"; }
        require MISP_DB_PASSWORD "$${MISP_DB_PASSWORD:-}"
        require MISP_DB_ROOT_PASSWORD "$${MISP_DB_ROOT_PASSWORD:-}"
        require MISP_REDIS_PASSWORD "$${MISP_REDIS_PASSWORD:-}"
        require MISP_ADMIN_EMAIL "$${MISP_ADMIN_EMAIL:-}"
        require MISP_ADMIN_PASSWORD "$${MISP_ADMIN_PASSWORD:-}"
        require MISP_ADMIN_KEY "$${MISP_ADMIN_KEY:-}"
        require MISP_GPG_PASSPHRASE "$${MISP_GPG_PASSPHRASE:-}"
        require MISP_ENCRYPTION_KEY "$${MISP_ENCRYPTION_KEY:-}"
        if [ -n "$missing" ]; then
          echo "ERROR: the 'intel' profile is missing required .env values:$missing" >&2
          echo "Generate each value locally (see misp/seeding.md) - no defaults are shipped on purpose." >&2
          exit 1
        fi
        echo "intel profile: required MISP secrets are present"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 32M

  misp-db:
    image: mariadb:10.11.19
    container_name: soc-misp-db
    restart: unless-stopped
    profiles: ["intel"]
    depends_on:
      misp-preflight:
        condition: service_completed_successfully
    # Lab-sized InnoDB settings (upstream misp-docker ships 2048M+; this profile
    # is sized to run next to the default stack on a workstation).
    command:
      - "--innodb-buffer-pool-size=${MISP_INNODB_BUFFER_POOL_SIZE:-512M}"
      - "--innodb-change-buffering=none"
      - "--innodb-io-capacity=200"
      - "--innodb-io-capacity-max=400"
      - "--innodb-log-file-size=128M"
      - "--innodb-stats-persistent=ON"
    environment:
      MYSQL_USER: ${MISP_DB_USER:-misp}
      MYSQL_DATABASE: ${MISP_DB_NAME:-misp}
      # Required, no committed defaults: misp-preflight has already refused to
      # start the profile if this is empty (see the guard above).
      MYSQL_PASSWORD: ${MISP_DB_PASSWORD:-}
      MYSQL_ROOT_PASSWORD: ${MISP_DB_ROOT_PASSWORD:-}
      TZ: ${TZ:-UTC}
    volumes:
      - misp-db-data:/var/lib/mysql
    networks:
      - soc-core
    healthcheck:
      test:
        - "CMD-SHELL"
        - "mysqladmin --user=\"$$MYSQL_USER\" --password=\"$$MYSQL_PASSWORD\" status >/dev/null 2>&1 || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  misp-redis:
    image: valkey/valkey:7.2.14
    container_name: soc-misp-redis
    restart: unless-stopped
    profiles: ["intel"]
    depends_on:
      misp-preflight:
        condition: service_completed_successfully
    command:
      - "valkey-server"
      - "--requirepass"
      - "${MISP_REDIS_PASSWORD:-}"
      - "--maxmemory"
      - "${MISP_REDIS_MAXMEMORY:-256mb}"
      - "--maxmemory-policy"
      - "allkeys-lru"
    environment:
      # Passed through for the healthcheck (never a committed literal).
      REDIS_PASSWORD: ${MISP_REDIS_PASSWORD:-}
      TZ: ${TZ:-UTC}
    volumes:
      - misp-redis-data:/data
    networks:
      - soc-core
    healthcheck:
      test:
        - "CMD-SHELL"
        - "valkey-cli -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  misp-core:
    image: ghcr.io/misp/misp-docker/misp-core:v2.5.46
    container_name: soc-misp-core
    restart: unless-stopped
    profiles: ["intel"]
    depends_on:
      misp-preflight:
        condition: service_completed_successfully
      misp-db:
        condition: service_healthy
      misp-redis:
        condition: service_healthy
    environment:
      # Internal-only base URL: the platform reaches MISP through the internal
      # misp-nginx HTTP endpoint on the `soc-core` network. Override only when
      # the URL genuinely changes (MISP pins its baseurl at first init).
      BASE_URL: ${MISP_BASE_URL:-http://misp-nginx:8080}
      ADMIN_EMAIL: ${MISP_ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${MISP_ADMIN_PASSWORD:-}
      ADMIN_ORG: ${MISP_ADMIN_ORG:-SOC Lab Synthetic}
      # The API key the platform authenticates with (MISP_API_KEY) must be this
      # same value: setting it here keeps the seeded instance deterministic
      # instead of relying on a key generated at first boot.
      ADMIN_KEY: ${MISP_ADMIN_KEY:-}
      GPG_PASSPHRASE: ${MISP_GPG_PASSPHRASE:-}
      ENCRYPTION_KEY: ${MISP_ENCRYPTION_KEY:-}
      # Determinism: no background feed fetches/updates, and no plaintext
      # credential echo into container logs.
      ENABLE_BACKGROUND_UPDATES: "false"
      DISABLE_PRINTING_PLAINTEXT_CREDENTIALS: "true"
      MYSQL_HOST: misp-db
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MISP_DB_USER:-misp}
      MYSQL_PASSWORD: ${MISP_DB_PASSWORD:-}
      MYSQL_DATABASE: ${MISP_DB_NAME:-misp}
      REDIS_HOST: misp-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${MISP_REDIS_PASSWORD:-}
      TZ: ${TZ:-UTC}
    # Upstream parity: the MISP configure scripts call `sudo -u www-data` and
    # audit logging needs AUDIT_WRITE; nothing else is added.
    cap_add:
      - AUDIT_WRITE
    volumes:
      # State only; the repository ships no MISP runtime configuration.
      - misp-core-config:/var/www/MISP/app/Config
      - misp-core-files:/var/www/MISP/app/files
      - misp-core-gnupg:/var/www/MISP/.gnupg
    networks:
      - soc-core
    healthcheck:
      # Upstream misp-core readiness probe: PHP-FPM listens on 9002.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9002' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  misp-nginx:
    image: ghcr.io/misp/misp-docker/misp-nginx:v2.5.46
    container_name: soc-misp-nginx
    restart: unless-stopped
    profiles: ["intel"]
    depends_on:
      misp-preflight:
        condition: service_completed_successfully
      misp-core:
        condition: service_healthy
    environment:
      BASE_URL: ${MISP_BASE_URL:-http://misp-nginx:8080}
      # FastCGI upstream inside the compose network (upstream default).
      FASTCGI_LISTEN: misp-core:9002
      TZ: ${TZ:-UTC}
    # Internal only: no `ports:` entry — MISP is never host-visible
    # (ARCHITECTURE.md §13). See misp/seeding.md for the operator-local,
    # explicitly-opted-in port-forward used for one-off UI seeding.
    expose:
      - "8080"
    networks:
      - soc-core
    # No compose healthcheck here: the image ships its own HEALTHCHECK (HTTP
    # status probe against the internal status listener on 8081), which is the
    # upstream-supported check the misp-docker project maintains.
    user: nginx
    read_only: true
    tmpfs:
      # Modes match upstream so the unprivileged nginx user can write the
      # generated listen/ssl include files into conf.d.
      - /etc/nginx/conf.d:mode=0755,uid=101,gid=101
      - /var/cache/nginx:mode=0755,uid=101,gid=101
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

networks:
  soc-core:
    driver: bridge
  soc-edge:
    driver: bridge

volumes:
  n8n-data:
    driver: local
  # Phase 3.7 (D11) — observability profile state only (additive; never
  # required by the default stack).
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  # Phase 4.1 — `full` profile state only (additive; never required by the
  # default `sim` stack).
  wazuh-manager-etc:
    driver: local
  wazuh-manager-logs:
    driver: local
  wazuh-manager-queue:
    driver: local
  # Phase 2.4 — `intel` profile state only (additive; never required by the
  # default stack). Holds the MISP database, cache, config, attachments and GPG
  # material; MISP events never leave these volumes.
  misp-db-data:
    driver: local
  misp-redis-data:
    driver: local
  misp-core-config:
    driver: local
  misp-core-files:
    driver: local
  misp-core-gnupg:
    driver: local
