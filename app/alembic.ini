# Alembic configuration for the Triage API storage layer (Phase 1D).
#
# The database URL is resolved at runtime by alembic/env.py, in order:
#   1. an explicit SQLAlchemy connection injected by the application
#      (the API runs `alembic upgrade head` programmatically at startup);
#   2. the `sqlalchemy.url` main option below;
#   3. the TRIAGE_DB_URL environment variable (same variable the app uses).
#
# Manual usage (from this directory, with the app installed):
#   export TRIAGE_DB_URL=sqlite:////data/soc_triage.db
#   alembic upgrade head
#   alembic downgrade base   # reproducible; safe on a scratch database
# Migrations are reproducible: downgrading to `base` and re-upgrading to
# `head` must always succeed (verified by the test suite).

[alembic]
# path to migration scripts
script_location = alembic

# add the application source to sys.path so `soc_triage` is importable
prepend_sys_path = .

# leave empty to resolve the URL from TRIAGE_DB_URL / the app's connection
sqlalchemy.url =

[post_write_hooks]
# keep migrations formatted the same way as the rest of the codebase
# (runs as `python -m ruff format` with the interpreter invoking alembic)
hooks = ruff
ruff.type = console_scripts
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
